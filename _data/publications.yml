  abstract: >-
    This paper presents a novel metal–insulator-metal (MIM) microbolometer structure incorporating
    plasmonic metamaterial absorbers to enhance long-wave infrared (LWIR) detection significantly.
    Utilizing an innovative Al–LiNbO3–Au configuration, the proposed design strategically employs
    aluminum for its superior absorbance and cost-effectiveness, coupled with a gold mirror to prevent
    light penetration and ensure high reflectance. This structure aims to achieve high and selective
    absorption in the midwave infrared (MWIR) and LWIR regions. By optimizing the geometry of the
    absorber, specifically the lateral dimensions of the aluminum resonator within the array, our
    results demonstrate high absorbance rates of up to 99.26% at 10.75 µm, a significant improvement
