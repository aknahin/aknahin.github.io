- title: Design optimization of wearable antennas using an adaptive network-based fuzzy inference system
  authors: Asrafuzzaman Khan Nahin, Waleed M Hamanah, Alaa Hussein, Ali Ahmed Salem, Mohamed Ali Abido
  year: 2026
  date: 19 May 2026
  journal: Scientific Reports
  publisher: Nature Publishing Group UK
  rank: SJR Q1 · 0.893
  abstract: >-
    This paper presents a data-driven optimization framework for wearable microstrip patch antennas
    operating near the 2.4 GHz ISM band using an Adaptive Network-Based Fuzzy Inference System (ANFIS).
    The proposed approach predicts key antenna geometry parameters—patch width, patch length, and feed
    point coordinates—from target electromagnetic performance metrics, including resonant frequency,
    reflection coefficient, bandwidth, and substrate thickness. A dataset of 500 samples was extracted
    from parametric HFSS simulations, and the ANFIS model was trained using a 70/30 training-testing
    split. Four membership function types “triangular, trapezoidal, Gaussian, and generalized bell” were
    systematically evaluated to analyze their influence on prediction accuracy and convergence behavior.
    Results demonstrate strong agreement between ANFIS predictions and HFSS simulations, with
