- title: Numerical analysis of an asymmetric hexagonal plasmonic refractive index sensor model based on metal–insulator–metal and Si-insulator-Si waveguide
  authors: Tanzim Afdol, Md Omar Faruque, Rabiul Al Mahmud, Rakibul Hasan Sagor, Asrafuzzaman Khan Nahin, Md Abu Abdullah Aumi, KM Sazid Hasan, Sadman Sazid, Najm Mogalli Nasser Nasser
  year: 2023
  date: 1 June 2023
  journal: Sensing and Bio-Sensing Research
  volume: 40
  pages: "100563"
  publisher: Elsevier
  rank: SJR Q2 · 0.633
  url: https://doi.org/10.1016/j.sbsr.2023.100563
  doi: 10.1016/j.sbsr.2023.100563
  abstract: >-
    In this paper, a plasmonic refractive index sensor consisting of a Metal-Insulator-Metal (MIM)
    waveguide is proposed introducing a hexagonal ring resonator coupled with two waveguides for the
    sensing purpose of the refractive index with fabrication plan. The simulation results obtained from
    the analysis, electromagnetic field and transmission spectra have been observed. We have demonstrated
    the change in transmittance if specific physical parameters are changed in the design. By tuning the
    device, the sensitivity of the structure can go up to 2950 nm/RIU and FoM up to 43.055. Furthermore,
    the base material is changed to doped silicon to make the device CMOS-compatible.
